[build-system]
requires = ["setuptools>=77", "wheel"]   # >= 77: SPDX `license` (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "hexmesh"
version = "0.3.0"
description = "Composable structured hex mesh generation for CFD pipe systems"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
io = [
    "scipy>=1.10",      # bathymetry interpolation
    "numpy>=1.24",
]
dev = [
    "pytest>=7",
    "pytest-cov",
    "pytest-xdist>=3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hexmesh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel by default (pytest-xdist, one process per core; each test has its
# own gmsh session, see tests/conftest.py).  Serial: -n 0.
# OpenFOAM tests are opt-in: -m openfoam.
addopts = "-n auto -m 'not openfoam'"
markers = [
    "openfoam: needs an OpenFOAM installation (gmshToFoam, splitMeshRegions, ...); opt-in with -m openfoam",
]
